<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalp Animasyonu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            position: relative;
            width: 600px;
            height: 600px; 
        }

        .word {
            position: absolute;
            color: #ff1a40; /* Canlı kırmızı tonu */
            font-weight: 600;
            opacity: 0;
            transform: scale(0.2);
            transition: opacity 0.3s ease, transform 0.3s ease;
            text-shadow: 0 0 8px rgba(255, 26, 64, 0.5);
            white-space: nowrap;
        }

        .word.visible {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

    <div class="container" id="heart-container"></div>

    <script>
        const languages = [
            "Seni Seviyorum", "I Love You", "Te amo", "Je t'aime", 
            "Ich liebe dich", "Ti amo", "Я тебя люблю", "Te quiero", 
            "Kocham Cię", "Mahal kita", "Minä rakastan sinua", "Jeg elsker dig", 
            "Σ' αγαπώ", "Volim te", "Szeretlek", "Te dua", "Ik hou van jou", "Milujem ťa"
        ];

        const container = document.getElementById('heart-container');
        const wordElements = [];

        // 1. Çerçeve (Kontur) için noktalar
        const borderPointsCount = 100;
        const borderPoints = [];
        for (let i = 0; i < borderPointsCount; i++) {
            const t = (i / borderPointsCount) * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            borderPoints.push({ x, y, type: 'border', originalIndex: i });
        }

        // 2. İç kısım için noktalar (Yukarıdan aşağı dolması için Y koordinatına göre sıralayacağız)
        const innerPoints = [];
        for (let x = -13; x <= 13; x += 1.8) {
            for (let y = -14; y <= 11; y += 1.8) {
                // Kalbin içinde olup olmadığını kontrol eden matematiksel formül
                const eq = Math.pow(x/2.2, 2) + Math.pow(y/2.2, 2) - 1;
                // Yaklaşık kalp içi sınır kontrolü
                if (Math.pow(x/3, 2) + Math.pow(y/3, 2) - 1 < 3.5) {
                    // Çerçeveye çok yakın olmayanları alalım ki üst üste binmesinler
                    const checkDist = borderPoints.some(p => Math.hypot(p.x - x, p.y - y) < 1.5);
                    if (!checkDist) {
                        innerPoints.push({ x, y, type: 'inner' });
                    }
                }
            }
        }

        // İç kısımdaki noktaları yukarıdan aşağıya (Y eksenine göre küçükten büyüğe) sıralıyoruz
        innerPoints.sort((a, b) => a.y - b.y);

        // Hepsini birleştiriyoruz: Önce çevre, sonra yukarıdan aşağıya iç kısım
        const allPoints = [...borderPoints, ...innerPoints];

        // Noktaları ekrana basma
        allPoints.forEach((p, index) => {
            const span = document.createElement('span');
            span.classList.add('word');
            span.innerText = languages[index % languages.length];
            
            // Genişliği artırarak sıkışmayı önledik (18 kat sayısı ile)
            const posX = 300 + p.x * 18; 
            const posY = 300 + p.y * 18;
            
            span.style.fontSize = '12px';
            span.style.left = posX + 'px';
            span.style.top = posY + 'px';

            container.appendChild(span);
            wordElements.push({ element: span, type: p.type });
        });

        // Animasyon Sıralaması: Önce çerçeve, sonra iç kısım
        let currentIndex = 0;

        function animateHeart() {
            if (currentIndex < wordElements.length) {
                wordElements[currentIndex].element.classList.add('visible');
                currentIndex++;
                
                // Çerçeve çizilirken biraz daha hızlı, iç kısım dolarken akıcı bir hız
                let speed = 25;
                setTimeout(animateHeart, speed);
            }
        }

        // Sayfa açıldıktan kısa süre sonra başlat
        window.onload = () => {
            setTimeout(animateHeart, 400);
        };
    </script>

</body>
</html>
